<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Store screenshots</title>
<style>
  :root{
    --brand:#2D8044;
    --ink:#0B0B0D;
    --g6:#F2F2F7; --g5:#E5E5EA; --g4:#D1D1D6; --g3:#C7C7CC;
    --sec:rgba(60,60,67,.60);
    --blue:#007AFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111;}
  body{font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;}
  .rnd{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;}

  /* ---------- panel shell ---------- */
  .panel{
    position:relative;width:1290px;height:2796px;overflow:hidden;isolation:isolate;
  }
  .panel .bg{position:absolute;inset:0;z-index:0}
  .glow{
    position:absolute;left:50%;top:52%;width:1500px;height:1500px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.20) 0%,rgba(255,255,255,.07) 38%,rgba(255,255,255,0) 68%);
    z-index:1;pointer-events:none;
  }
  .orb{position:absolute;border-radius:50%;z-index:1;pointer-events:none}
  .grain{
    position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle at 18% 12%,rgba(255,255,255,.10),transparent 45%),
      radial-gradient(circle at 84% 88%,rgba(0,0,0,.22),transparent 55%);
  }

  /* ---------- copy ---------- */
  .copy{position:absolute;left:0;right:0;top:132px;z-index:5;padding:0 96px;text-align:center}
  .eyebrow{
    display:inline-block;margin-bottom:34px;padding:15px 34px;border-radius:999px;
    background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.28);
    color:#fff;font-size:33px;font-weight:650;letter-spacing:.6px;
    box-shadow:0 10px 26px rgba(0,0,0,.18), inset 0 1.5px 0 rgba(255,255,255,.4);
  }
  h1{
    color:#fff;font-size:97px;line-height:1.05;font-weight:800;letter-spacing:-3px;
    text-shadow:0 8px 34px rgba(0,0,0,.30);
  }
  h1.sm{font-size:92px;letter-spacing:-2.8px}
  .sub{
    margin-top:32px;color:rgba(255,255,255,.80);font-size:43px;line-height:1.36;
    font-weight:480;letter-spacing:-.4px;max-width:960px;margin-left:auto;margin-right:auto;
    text-shadow:0 3px 16px rgba(0,0,0,.24);
  }

  /* ---------- 3D stage ---------- */
  .stage{position:absolute;left:0;right:0;top:0;bottom:0;z-index:4;perspective:1750px;perspective-origin:50% 34%}
  .device{
    position:absolute;left:50%;margin-left:-215px;top:742px;
    width:430px;height:932px;border-radius:66px;
    background:linear-gradient(155deg,#4a4a50,#0d0d10 42%,#000);
    padding:13px;
    transform-origin:50% 0%;
    transform-style:preserve-3d;
    box-shadow:
      0 6px 0 rgba(255,255,255,.10) inset,
      -26px 48px 120px rgba(0,0,0,.55),
      -10px 20px 46px rgba(0,0,0,.42),
      0 0 0 2px rgba(255,255,255,.13);
  }
  .device.tilt{transform:scale(1.95) rotateY(-19deg) rotateX(7deg) rotateZ(-2.2deg)}
  .device.flat{transform:scale(1.95) rotateY(-7deg) rotateX(3deg)}
  /* rim light on the edge facing the viewer */
  .device::before{
    content:"";position:absolute;left:0;top:34px;bottom:34px;width:5px;border-radius:5px;z-index:41;
    background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  }
  .device::after{ /* screen specular */
    content:"";position:absolute;inset:13px;border-radius:54px;pointer-events:none;z-index:40;
    background:linear-gradient(118deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 46%);
  }
  .screen{
    position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;
    background:var(--g6);color:#000;font-size:16px;
  }
  .shadowpad{
    position:absolute;left:50%;top:2470px;width:1080px;height:170px;z-index:3;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.40),rgba(0,0,0,0) 68%);
    filter:blur(14px);
  }

  /* ---------- floating glass cards ---------- */
  .fcard{
    position:absolute;z-index:5;border-radius:34px;
    background:linear-gradient(150deg,#ffffff,#f4f6f8);
    box-shadow:
      0 34px 70px rgba(0,0,0,.34),
      0 10px 22px rgba(0,0,0,.20),
      inset 0 2px 0 #fff;
    padding:30px 36px;
  }
  .fcard.dark{
    background:linear-gradient(150deg,rgba(20,42,32,.96),rgba(10,26,26,.96));
    box-shadow:0 34px 70px rgba(0,0,0,.42),0 10px 22px rgba(0,0,0,.26),inset 0 2px 0 rgba(255,255,255,.18);
  }
  .fc-row{display:flex;align-items:center;gap:22px}
  .fc-ico{
    width:78px;height:78px;border-radius:24px;display:grid;place-items:center;flex:none;
    box-shadow:0 12px 24px rgba(0,0,0,.20), inset 0 2px 0 rgba(255,255,255,.55);
  }
  .fc-ico svg{width:42px;height:42px}
  .fc-val{font-size:52px;font-weight:800;letter-spacing:-1.6px;color:#0d1a12;line-height:1}
  .fc-lab{font-size:26px;font-weight:600;color:rgba(20,40,28,.58);margin-top:8px;letter-spacing:-.2px}
  .fcard.dark .fc-val{color:#fff}
  .fcard.dark .fc-lab{color:rgba(255,255,255,.62)}

  /* ---------- generic iOS screen bits ---------- */
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:16px 30px 0;font-size:15px;font-weight:640;letter-spacing:-.2px}
  .sb-r{display:flex;align-items:center;gap:6px}
  .sb-r svg{width:17px;height:17px}
  .navlarge{padding:12px 20px 4px;font-size:34px;font-weight:800;letter-spacing:-1px}
  .navrow{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
  .navrow .navlarge{padding:0}
  .navinline{text-align:center;font-size:17px;font-weight:650;padding:14px 0 10px;border-bottom:.5px solid rgba(60,60,67,.22)}
  .body{padding:0 20px}

  .card{background:#fff;border-radius:16px;box-shadow:0 3px 8px rgba(0,0,0,.05)}
  .muted{color:var(--sec)}

  /* hero protection card */
  .hero{
    border-radius:24px;padding:26px 20px;text-align:center;color:#fff;
    background:linear-gradient(135deg,#28733D,#1B593B);
    box-shadow:0 8px 20px rgba(45,128,68,.40);
  }
  .hero .ring{position:relative;width:100px;height:100px;margin:0 auto 18px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
  .hero .ring::before{content:"";position:absolute;width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
  .hero .ring svg{width:46px;height:46px}
  .hero h3{font-size:22px;font-weight:700;letter-spacing:-.4px}
  .hero p{font-size:15px;color:rgba(255,255,255,.85);margin-top:8px;line-height:1.3;padding:0 12px}

  .stats{display:flex;gap:12px;margin-top:20px}
  .qs{flex:1;background:#fff;border-radius:16px;box-shadow:0 3px 8px rgba(0,0,0,.05);padding:16px 6px;text-align:center}
  .qs svg{width:22px;height:22px}
  .qs .v{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:8px}
  .qs .l{font-size:11px;font-weight:520;color:var(--sec);margin-top:8px;line-height:1.25}

  .dbcard{display:flex;align-items:center;gap:12px;padding:16px;margin-top:20px}
  .dbdot{width:40px;height:40px;border-radius:50%;background:rgba(52,199,89,.12);display:grid;place-items:center;flex:none}
  .dbdot svg{width:21px;height:21px;color:#34C759}
  .dbcard .t{font-size:15px;font-weight:640;letter-spacing:-.2px}
  .dbcard .s{font-size:12px;color:var(--sec);margin-top:2px}
  .dbcard .u{font-size:11px;color:var(--sec);margin-top:2px}

  .cta{
    margin-top:20px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;
    background:linear-gradient(135deg,#2D8044,rgba(45,128,68,.80));color:#fff;
    box-shadow:0 6px 14px rgba(45,128,68,.35);font-size:20px;font-weight:750;letter-spacing:-.3px;
  }
  .cta svg{width:24px;height:24px}

  /* streak hero */
  .shero{
    position:relative;border-radius:22px;padding:28px 20px;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,#1D6130,#1D3B47);
    box-shadow:0 8px 16px rgba(38,76,49,.30);
  }
  .shero .o1{position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);right:-60px;top:-60px}
  .shero .o2{position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.04);left:-70px;bottom:-40px}
  .shero .gear{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
  .shero .gear svg{width:16px;height:16px;color:rgba(255,255,255,.7)}
  .sring{position:relative;width:140px;height:140px;margin:0 auto;display:grid;place-items:center}
  .sring svg{position:absolute;inset:0;width:140px;height:140px;transform:rotate(-90deg)}
  .sring .n{font-size:48px;font-weight:800;line-height:1;letter-spacing:-1.5px}
  .sring .d{font-size:11px;font-weight:640;color:rgba(255,255,255,.7);letter-spacing:2px;margin-top:2px}
  .slabel{text-align:center;margin-top:16px}
  .slabel .a{font-size:20px;font-weight:750;letter-spacing:-.3px}
  .slabel .b{font-size:15px;color:rgba(255,255,255,.65);margin-top:4px}
  .srow{display:flex;margin-top:16px}
  .srow .c{flex:1;text-align:center}
  .srow .v{font-size:18px;font-weight:800;letter-spacing:-.4px}
  .srow .k{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;letter-spacing:.5px}
  .srow .sep{width:1px;height:30px;background:rgba(255,255,255,.2);align-self:center}
  .checkin{
    margin-top:16px;background:#fff;border-radius:999px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;
    color:#185228;font-size:15px;font-weight:640;
  }
  .checkin svg{width:19px;height:19px}
  .sfoot{text-align:center;margin-top:16px;font-size:12px;color:rgba(255,255,255,.55);text-decoration:underline}

  .sect{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:20px 4px 12px}
  .mrow{display:flex;gap:12px}
  .mb{width:68px;text-align:center}
  .mb .cir{width:58px;height:58px;border-radius:50%;margin:0 auto;display:grid;place-items:center}
  .mb .cir svg{width:23px;height:23px}
  .mb .lb{font-size:11px;margin-top:6px}
  .mb.on .lb{font-weight:640;color:#000}
  .mb.off{transform:scale(.93)}
  .mb.off .cir{background:var(--g6)}
  .mb.off .cir svg{color:var(--g4)}
  .mb.off .lb{color:var(--sec)}

  /* browser */
  .bbar{background:#fff;padding:8px 14px 4px;border-bottom:.5px solid rgba(60,60,67,.29)}
  .brow{display:flex;align-items:center;gap:10px}
  .pill{flex:1;background:var(--g6);border-radius:999px;padding:11px 12px;display:flex;align-items:center;gap:8px;min-width:0}
  .pbadge{width:22px;height:22px;border-radius:50%;background:#3F8C55;display:grid;place-items:center;flex:none}
  .pbadge svg{width:11px;height:11px;color:#fff}
  .purl{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .purl b{font-weight:640}
  .purl span{color:var(--sec)}
  .tabbtn{width:42px;height:42px;border-radius:50%;background:var(--g6);display:grid;place-items:center;flex:none}
  .tabbtn i{width:20px;height:20px;border:1.8px solid #000;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
  .plusbtn{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
  .plusbtn svg{width:20px;height:20px;color:#fff}
  .brow2{display:flex;align-items:center;gap:20px;padding:6px 6px 2px}
  .brow2 svg{width:18px;height:18px}
  .brow2 .hint{flex:1;text-align:center;font-size:12px;color:var(--sec)}

  .tabhead{text-align:center;padding:14px 0 2px}
  .tabhead .t{font-size:17px;font-weight:700}
  .tabhead .s{font-size:12px;color:var(--sec);margin-top:1px}
  .searchf{margin:12px 16px;background:var(--g5);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;color:var(--sec);font-size:15px}
  .searchf svg{width:16px;height:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 16px 16px}
  .gcard{background:#fff;border-radius:20px;box-shadow:0 3px 6px rgba(0,0,0,.05);overflow:hidden;position:relative}
  .gcard.act{box-shadow:0 3px 6px rgba(0,0,0,.05),0 0 0 2px var(--blue)}
  .gprev{height:112px;padding:26px 16px 8px}
  .skel{height:8px;border-radius:3px;background:var(--g5);margin-bottom:7px}
  .gx{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--g5);display:grid;place-items:center;color:var(--sec);font-size:12px;font-weight:700}
  .gfoot{display:flex;align-items:center;gap:8px;padding:12px}
  .mono{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
  .gfoot .tt{font-size:15px;font-weight:640;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gfoot .hh{font-size:11px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* chat */
  /* justify-end + overflow:hidden clips the OLDEST messages, so a conversation
     longer than the canvas reads as scrollback instead of spilling over the nav bar */
  .msgs{position:absolute;left:0;right:0;top:82px;bottom:150px;padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;overflow:hidden}
  .b-a,.b-u{max-width:82%;border-radius:18px;padding:10px 14px;font-size:16px;line-height:1.35;letter-spacing:-.2px}
  .b-a{background:#fff;border:1px solid var(--g5);align-self:flex-start}
  .b-u{background:var(--brand);color:#fff;align-self:flex-end}
  .acts{display:flex;gap:16px;align-items:center;color:var(--sec);padding:0 4px;margin-top:-4px}
  .acts svg{width:15px;height:15px}
  .composer{position:absolute;left:0;right:0;bottom:84px;background:var(--g6);padding:10px 12px;display:flex;align-items:center;gap:8px}
  .tfield{flex:1;background:#fff;border:1px solid var(--g4);border-radius:22px;padding:10px 14px;font-size:16px;color:var(--sec)}
  .send{width:38px;height:38px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none}
  .send svg{width:18px;height:18px;color:#fff}
  .esphere{width:96px;height:96px;border-radius:50%;background:rgba(45,128,68,.15);display:grid;place-items:center;margin:0 auto}
  .esphere svg{width:42px;height:42px;color:var(--brand)}
  .prompt{background:#fff;border-radius:14px;box-shadow:0 2px 4px rgba(0,0,0,.04);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:-.2px}
  .prompt svg{width:15px;height:15px;color:var(--sec);flex:none;margin-left:auto}

  /* tabbar */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:84px;padding:10px 8px 0;
    background:rgba(249,249,249,.94);border-top:.5px solid rgba(60,60,67,.22);
    display:flex;align-items:flex-start;
  }
  .tb{flex:1;text-align:center;color:#8E8E93}
  .tb.on{color:var(--brand)}
  .tb svg{width:25px;height:25px}
  .tb span{display:block;font-size:10px;font-weight:520;margin-top:3px;letter-spacing:-.1px}
  .homebar{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:140px;height:5px;border-radius:3px;background:#000;opacity:.28}

  /* step chips for panel 6 */
  .steps{position:absolute;z-index:5;left:96px;right:96px;top:820px;display:flex;flex-direction:column;gap:34px}
  .step{
    display:flex;align-items:center;gap:32px;padding:38px 42px;border-radius:38px;
    background:linear-gradient(150deg,rgba(255,255,255,.99),rgba(240,246,242,.97));
    box-shadow:0 30px 62px rgba(0,0,0,.30),0 8px 18px rgba(0,0,0,.16),inset 0 2px 0 #fff;
  }
  .step .n{
    width:96px;height:96px;border-radius:30px;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,#37A05A,#1C6A3C);color:#fff;font-size:46px;font-weight:800;
    box-shadow:0 14px 26px rgba(28,106,60,.42),inset 0 2px 0 rgba(255,255,255,.4);
  }
  .step .t{font-size:44px;font-weight:750;letter-spacing:-1.2px;color:#0d1a12}
  .step .d{font-size:30px;font-weight:480;color:rgba(20,40,28,.58);margin-top:8px;letter-spacing:-.3px;line-height:1.3}

  /* proof panel */
  .proof{position:absolute;z-index:5;left:0;right:0;top:800px;padding:0 92px;display:flex;flex-direction:column;gap:36px}
  .pbig{
    border-radius:44px;padding:56px 56px;text-align:center;
    background:linear-gradient(150deg,rgba(255,255,255,.99),rgba(238,246,241,.97));
    box-shadow:0 36px 74px rgba(0,0,0,.32),0 10px 22px rgba(0,0,0,.18),inset 0 2px 0 #fff;
  }
  .pbig .v{font-size:150px;font-weight:850;letter-spacing:-6px;line-height:1;color:#12301F}
  .pbig .l{font-size:34px;font-weight:620;color:rgba(20,40,28,.56);margin-top:16px;letter-spacing:-.4px}
  .ptwo{display:flex;gap:36px}
  .ptwo>div{
    flex:1;border-radius:38px;padding:44px 32px;text-align:center;
    background:linear-gradient(150deg,rgba(255,255,255,.98),rgba(238,246,241,.96));
    box-shadow:0 30px 62px rgba(0,0,0,.30),0 8px 18px rgba(0,0,0,.16),inset 0 2px 0 #fff;
  }
  .ptwo .v{font-size:82px;font-weight:820;letter-spacing:-3px;line-height:1;color:#12301F}
  .ptwo .l{font-size:27px;font-weight:600;color:rgba(20,40,28,.56);margin-top:12px;letter-spacing:-.3px}
  .pnote{
    display:flex;align-items:center;justify-content:center;gap:18px;color:#fff;font-size:32px;font-weight:600;
    letter-spacing:-.3px;opacity:.9;
  }
  .pnote svg{width:38px;height:38px}

  /* ============================================================
     iPad 13" mode  (2064 x 2752).  The app has NO iPad-specific
     layout — no size classes, no maxWidth caps — so the screen
     content here is deliberately the same markup stretched to
     1032pt wide, which is what the shipping app actually does.
     ============================================================ */
  body.ipad .panel{width:2064px;height:2752px}
  body.ipad .copy{top:150px;padding:0 200px}
  body.ipad .eyebrow{font-size:39px;padding:18px 40px;margin-bottom:40px}
  body.ipad h1{font-size:124px;letter-spacing:-3.8px}
  body.ipad h1.sm{font-size:116px}
  body.ipad .sub{font-size:52px;margin-top:38px;max-width:1400px}

  body.ipad .stage{perspective:3400px;perspective-origin:50% 30%}
  body.ipad .device{
    width:1032px;height:1376px;margin-left:-516px;top:800px;
    border-radius:50px;padding:20px;
  }
  body.ipad .device.tilt{transform:scale(1.37) rotateY(-13deg) rotateX(4deg) rotateZ(-1.4deg)}
  body.ipad .device::after{inset:20px;border-radius:30px}
  body.ipad .device::before{top:60px;bottom:60px}
  body.ipad .screen{border-radius:30px}
  body.ipad .shadowpad{top:2560px;width:1700px;height:200px}
  body.ipad .glow{width:2300px;height:2300px}

  /* iPadOS centers tab-bar items instead of spreading them */
  body.ipad .tabbar{justify-content:center;gap:66px;height:70px;padding-top:8px}
  body.ipad .tb{flex:none;min-width:96px}
  body.ipad .homebar{width:320px}

  body.ipad .fcard{border-radius:44px;padding:40px 48px}
  body.ipad .fc-ico{width:104px;height:104px;border-radius:32px}
  body.ipad .fc-ico svg{width:56px;height:56px}
  body.ipad .fc-val{font-size:68px;letter-spacing:-2.2px}
  body.ipad .fc-lab{font-size:34px;margin-top:11px}

  body.ipad .proof{top:790px;padding:0 250px;gap:46px}
  body.ipad .pbig{border-radius:56px;padding:64px}
  body.ipad .pbig .v{font-size:210px;letter-spacing:-8px}
  body.ipad .pbig .l{font-size:44px;margin-top:20px}
  body.ipad .ptwo{gap:46px}
  body.ipad .ptwo>div{border-radius:48px;padding:56px 40px}
  body.ipad .ptwo .v{font-size:112px;letter-spacing:-4px}
  body.ipad .ptwo .l{font-size:34px;margin-top:16px}

      <div style="position:absolute;top:2px;${on?'right:2px':'left:2px'};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)"></div></div>`;
  const row=(ic,col,name,right,last)=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 14px;${last?'':'border-bottom:.5px solid rgba(60,60,67,.14)'}">
      <div style="width:30px;height:30px;border-radius:8px;background:${col}22;display:grid;place-items:center;color:${col}"><div style="width:16px;height:16px">${svg(ic)}</div></div>
      <div style="flex:1;font-size:16px;letter-spacing:-.2px">${name}</div>${right}</div>`;
  const chev=`<div style="width:11px;color:var(--g3)">${svg('chevR')}</div>`;
  return `<div class="screen">${statusbar()}
    <div class="navrow" style="padding-top:6px">
      <div style="width:11px;color:#007AFF">${svg('chevL')}</div>
      <div style="font-size:17px;font-weight:650">Blocklist</div>
      <div style="width:19px"></div>
    </div>
    <div class="body" style="padding-top:14px">
      <div style="border-radius:20px;padding:26px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,#28733D,#1B593B);box-shadow:0 8px 18px rgba(45,128,68,.35)">
        <div class="rnd" style="font-size:44px;font-weight:800;letter-spacing:-1.4px">172,912</div>
        <div style="font-size:14px;color:rgba(255,255,255,.8);margin-top:4px">sites in your blocklist</div>
        <div style="display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:600">
          <div style="width:15px;height:15px">${svg('checkcircle')}</div>Up to date</div>
        <div style="font-size:12px;color:rgba(255,255,255,.65);margin-top:12px">Last checked today, 6:04 AM</div>
      </div>
      <div class="card" style="overflow:hidden;margin-top:18px">
        ${row('refresh','#396FBF','Auto-update daily',toggle(1))}
        ${row('wifi','#8F52CC','Wi-Fi only',toggle(1),1)}
      </div>
      <div class="sect" style="margin:20px 4px 10px">Your additions</div>
      <div class="card" style="overflow:hidden">
        ${row('shield','#2D8044','Blocked sites','<div style="font-size:16px;color:var(--sec);margin-right:8px">14</div>'+chev)}
        ${row('key','#D97F2B','Blocked keywords','<div style="font-size:16px;color:var(--sec);margin-right:8px">38</div>'+chev)}
        ${row('checkcircle','#34C759','Allowed sites','<div style="font-size:16px;color:var(--sec);margin-right:8px">3</div>'+chev,1)}
      </div>
    </div>
    ${tabbar(4)}</div>`;
}

function screenSettings(){
  const toggle = on => `<div style="width:44px;height:26px;border-radius:999px;background:${on?'#2D8044':'#E5E5EA'};position:relative;flex:none">
      <div style="position:absolute;top:2px;${on?'right:2px':'left:2px'};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)"></div></div>`;
  const row=(ic,col,name,right,last)=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 14px;${last?'':'border-bottom:.5px solid rgba(60,60,67,.14)'}">
      <div style="width:30px;height:30px;border-radius:8px;background:${col}22;display:grid;place-items:center;color:${col}"><div style="width:16px;height:16px">${svg(ic)}</div></div>
      <div style="flex:1;font-size:16px;letter-spacing:-.2px">${name}</div>${right}</div>`;
  return `<div class="screen">${statusbar()}
    <div class="navlarge">Settings</div>
    <div class="body" style="padding-top:8px">
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#2D80441A;border:1px solid #2D804433;margin-bottom:18px">
        <div style="width:40px;height:40px;border-radius:50%;background:#2D8044;display:grid;place-items:center;color:#fff"><div style="width:22px;height:22px">${shieldCheck('#2D8044')}</div></div>
        <div><div style="font-size:15px;font-weight:640">Safari extension enabled</div>
        <div style="font-size:12px;color:var(--sec);margin-top:2px">Blocking is live across Safari</div></div>
      </div>
      <div class="sect" style="margin:0 4px 10px">Protection</div>
      <div class="card" style="overflow:hidden">
        ${row('shield','#2D8044','Block adult sites',toggle(1))}
        ${row('key','#D97F2B','Keyword filtering',toggle(1))}
        ${row('search','#396FBF','Force safe search',toggle(1),1)}
      </div>
      <div class="sect" style="margin:20px 4px 10px">Reminders</div>
      <div class="card" style="overflow:hidden">
        ${row('bell','#8F52CC','Daily check-in','<div style="font-size:16px;color:var(--sec)">9:00 PM</div>')}
        ${row('heart','#BF4368','Milestone alerts',toggle(1),1)}
      </div>
    </div>
    ${tabbar(4)}</div>`;
}
