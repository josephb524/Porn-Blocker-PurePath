name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show available simulators
        run: xcrun simctl list devices available | head -30

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Porn Blocker.xcodeproj" \
            -scheme "Porn Blocker" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
